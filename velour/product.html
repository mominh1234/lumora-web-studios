<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velour — Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #f5f5f5;
      --grey:  #1a1a1a;
      --mid:   #2e2e2e;
      --muted: #888;
      --accent:#e8d5b0;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 64px;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; letter-spacing: 0.15em;
      color: var(--white); text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-cart {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--white); cursor: pointer;
      background: none; border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px; border-radius: 2px;
      transition: background 0.2s;
    }
    .nav-cart:hover { background: rgba(255,255,255,0.08); }
    .cart-count {
      background: var(--accent); color: var(--black);
      font-size: 0.65rem; font-weight: 600;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      padding: 96px 48px 0;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--white); }
    .breadcrumb span { color: rgba(255,255,255,0.25); }

    /* ── PRODUCT LAYOUT ── */
    .product-page {
      padding: 40px 48px 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 72px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* ── IMAGE PANEL ── */
    .product-image-wrap {
      position: sticky;
      top: 84px;
      align-self: start;
    }
    .main-image {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--grey);
    }
    .main-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .main-image:hover img { transform: scale(1.04); }
    .product-badge-lg {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
      background: var(--accent); color: var(--black);
      padding: 5px 12px;
    }

    /* ── INFO PANEL ── */
    .product-info { padding-top: 8px; }

    .product-cat-label {
      font-size: 0.68rem; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
    }
    .product-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 5vw, 4.2rem);
      letter-spacing: 0.04em; line-height: 1;
      margin-bottom: 20px;
    }
    .product-price-lg {
      font-size: 1.5rem; font-weight: 600;
      letter-spacing: 0.04em; margin-bottom: 32px;
      color: var(--white);
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 28px 0;
    }

    .product-desc {
      font-size: 0.93rem; font-weight: 300;
      color: rgba(245,245,245,0.72); line-height: 1.85;
      margin-bottom: 32px;
    }

    /* ── SIZE PICKER ── */
    .size-label {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
    }
    .size-options {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .size-btn {
      width: 48px; height: 48px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent; color: var(--white);
      font-size: 0.72rem; letter-spacing: 0.1em;
      cursor: pointer; transition: all 0.2s;
    }
    .size-btn:hover {
      border-color: var(--white);
      background: rgba(255,255,255,0.06);
    }
    .size-btn.selected {
      border-color: var(--white);
      background: var(--white);
      color: var(--black);
      font-weight: 600;
    }

    /* ── ADD TO BAG BTN ── */
    .add-btn {
      display: block; width: 100%; padding: 18px;
      background: var(--white); color: var(--black);
      border: none; cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
      transition: background 0.25s;
      margin-bottom: 14px;
    }
    .add-btn:hover { background: var(--accent); }

    .wishlist-btn {
      display: block; width: 100%; padding: 16px;
      background: transparent; color: var(--white);
      border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
      transition: border-color 0.2s;
    }
    .wishlist-btn:hover { border-color: var(--white); }

    /* ── PRODUCT DETAILS LIST ── */
    .details-title {
      font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 16px;
    }
    .details-list {
      list-style: none; display: flex; flex-direction: column; gap: 10px;
    }
    .details-list li {
      font-size: 0.85rem; font-weight: 300;
      color: rgba(245,245,245,0.65);
      display: flex; align-items: center; gap: 12px;
    }
    .details-list li::before {
      content: '';
      display: block; width: 18px; height: 1px;
      background: var(--accent); flex-shrink: 0;
    }

    /* ── ACCORDION ── */
    .accordion-block {
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .accordion-block:last-of-type {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 28px;
    }
    .accordion-btn {
      width: 100%; background: none; border: none;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--white); font-weight: 500;
      transition: color 0.2s;
    }
    .accordion-btn:hover { color: var(--accent); }
    .acc-icon { font-size: 1.1rem; font-weight: 300; transition: transform 0.25s; }
    .accordion-btn.open .acc-icon { transform: rotate(45deg); }
    .accordion-body {
      display: none;
      padding: 0 0 20px;
      font-size: 0.85rem; font-weight: 300;
      color: rgba(245,245,245,0.65); line-height: 1.8;
    }
    .accordion-body.open { display: block; }

    /* ── TRUST BADGES ── */
    .trust-row {
      display: flex; gap: 24px; flex-wrap: wrap;
      margin-top: 32px; padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .trust-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
    }
    .trust-icon { font-size: 1rem; }

    /* ── RELATED SECTION ── */
    .related-section {
      padding: 0 48px 100px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .related-header {
      margin-bottom: 36px;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 64px;
    }
    .related-tag {
      font-size: 0.68rem; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .related-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      letter-spacing: 0.04em;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .rel-card { cursor: pointer; transition: transform 0.3s; }
    .rel-card:hover { transform: translateY(-4px); }
    .rel-img {
      aspect-ratio: 3/4; overflow: hidden;
      background: var(--grey); margin-bottom: 14px; position: relative;
    }
    .rel-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .rel-card:hover .rel-img img { transform: scale(1.06); }
    .rel-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s;
    }
    .rel-card:hover .rel-overlay { opacity: 1; }
    .rel-overlay-btn {
      font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
      background: var(--white); color: var(--black);
      padding: 10px 20px; border: none; cursor: pointer;
      transition: background 0.2s;
    }
    .rel-overlay-btn:hover { background: var(--accent); }
    .rel-name { font-size: 0.88rem; font-weight: 500; margin-bottom: 4px; }
    .rel-price { font-size: 0.88rem; font-weight: 600; color: var(--muted); }

    /* ── CART DRAWER ── */
    .cart-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.6);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .cart-overlay.open { opacity: 1; pointer-events: all; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 201;
      width: 380px; background: var(--grey);
      border-left: 1px solid rgba(255,255,255,0.1);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-header {
      padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-header h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem; letter-spacing: 0.1em;
    }
    .cart-close {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; line-height: 1;
      transition: color 0.2s;
    }
    .cart-close:hover { color: var(--white); }
    .cart-items { flex: 1; overflow-y: auto; padding: 24px; }
    .cart-empty {
      text-align: center; color: var(--muted);
      font-size: 0.85rem; margin-top: 60px; line-height: 1.7;
    }
    .cart-item {
      display: flex; gap: 14px; margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .cart-item-img { width: 70px; height: 90px; object-fit: cover; flex-shrink: 0; }
    .cart-item-name { font-size: 0.88rem; font-weight: 500; margin-bottom: 4px; }
    .cart-item-size { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 8px; }
    .cart-item-price { font-size: 0.9rem; font-weight: 600; }
    .cart-item-remove {
      background: none; border: none; color: var(--muted);
      font-size: 0.7rem; cursor: pointer; letter-spacing: 0.1em;
      text-transform: uppercase; margin-top: 8px; padding: 0;
      transition: color 0.2s;
    }
    .cart-item-remove:hover { color: var(--white); }
    .cart-footer { padding: 24px; border-top: 1px solid rgba(255,255,255,0.08); }
    .cart-total {
      display: flex; justify-content: space-between;
      font-size: 0.9rem; font-weight: 600; margin-bottom: 16px;
    }
    .cart-checkout {
      display: block; width: 100%; padding: 16px;
      background: var(--white); color: var(--black);
      border: none; cursor: pointer;
      font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
      font-family: 'Inter', sans-serif; font-weight: 600;
      transition: background 0.2s;
    }
    .cart-checkout:hover { background: var(--accent); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--white); color: var(--black);
      padding: 12px 28px; font-size: 0.78rem;
      letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
      opacity: 0; transition: all 0.3s; z-index: 300;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── NOT FOUND ── */
    .not-found {
      padding: 160px 48px 100px;
      text-align: center;
    }
    .not-found h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem; letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .not-found p { color: var(--muted); margin-bottom: 32px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .product-page { grid-template-columns: 1fr; gap: 48px; padding: 32px 32px 80px; }
      .product-image-wrap { position: static; }
      .related-grid { grid-template-columns: repeat(2, 1fr); }
      .related-section { padding: 0 32px 80px; }
      .breadcrumb { padding: 96px 32px 0; }
    }
    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .product-page { padding: 24px 20px 60px; }
      .breadcrumb { padding: 84px 20px 0; }
      .related-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .related-section { padding: 0 20px 60px; }
      .cart-drawer { width: 100%; }
      .trust-row { gap: 16px; }
    }
  </style>
</head>
<body>

  <!-- Cart overlay -->
  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

  <!-- Cart drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Bag</h3>
      <button class="cart-close" onclick="closeCart()">×</button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty">Your bag is empty.<br/>Add something you love.</div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">£0</span>
      </div>
      <button class="cart-checkout" onclick="goToCheckout()">Checkout</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">Velour</a>
    <ul class="nav-links">
      <li><a href="index.html#shop">Shop</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#newsletter">Newsletter</a></li>
    </ul>
    <button class="nav-cart" onclick="openCart()">
      Bag <span class="cart-count" id="cartCount">0</span>
    </button>
  </nav>

  <!-- Page content injected by JS -->
  <div id="pageContent"></div>

  <script>
    // ── Products Data ──
    const products = [
      { id:1, name:'Oversized Tee', cat:'tops', price:45, badge:'New', img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80',
        desc:'Cut generously for a relaxed, effortless silhouette. Made from 100% heavyweight organic cotton with a pre-washed finish that only gets better with time. Ribbed crewneck, dropped shoulders, and a slightly longer back hem — built for the streets. Wear it tucked, half-tucked, or loose. This is the tee you\'ll keep reaching for.',
        details:['100% Organic Cotton, GOTS certified','280gsm heavyweight jersey','Pre-washed enzyme wash for instant softness','Dropped shoulder seam, relaxed boxy fit','Ribbed crewneck collar','Longer back hem for streetwear silhouette','Unisex — model wears size M, 6\'1"','Machine wash cold, tumble dry low','Made in Portugal'] },
      { id:2, name:'Cargo Trousers', cat:'bottoms', price:85, badge:'', img:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=800&q=80',
        desc:'Technical meets tailored. These wide-leg cargos feature six functional pockets, adjustable ankle cuffs, and a comfortable elasticated waistband. Crafted from durable ripstop cotton, they move with you from morning commute to late night. The utility detailing is kept clean and deliberate — nothing excessive, everything functional.',
        details:['98% Ripstop cotton, 2% elastane','Elasticated waistband with internal drawcord','6 fully functional pockets — 2 side, 2 cargo, 2 back','Adjustable ankle cuffs with tab fastening','Relaxed wide leg silhouette','Reinforced knee and pocket seams','Machine wash cold, hang dry','Model wears size M, 6\'0"','Made in Turkey'] },
      { id:3, name:'Washed Hoodie', cat:'tops', price:75, badge:'Bestseller', img:'https://images.unsplash.com/photo-1509942774463-acf339cf87d5?w=800&q=80',
        desc:'Our best-selling hoodie — and for good reason. Garment-washed for a vintage, lived-in feel from day one. Double-lined hood, kangaroo pocket, and a boxy cut that pairs with everything in your wardrobe. The heavyweight fleece holds its shape wash after wash. Once you wear it, you\'ll reach for it every single day.',
        details:['380gsm heavyweight loopback fleece','100% organic cotton, pre-shrunk','Garment-washed for a broken-in vintage feel','Double-lined hood with flat drawcord','Spacious kangaroo pocket','Ribbed hem and cuffs','Boxy, relaxed fit — true to size','Machine wash cold, tumble dry low','Model wears size L, 6\'1"','Made in Portugal'] },
      { id:4, name:'Coach Jacket', cat:'outerwear', price:120, badge:'New', img:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800&q=80',
        desc:'Lightweight enough to layer, refined enough to stand alone. This coach jacket is crafted from wind-resistant nylon with a clean snap-button front, utility pockets, and an embroidered Velour tab at the chest. Wear it over a hoodie when the temperature drops, or throw it on over a tee for effortless streetwear polish. A wardrobe essential.',
        details:['100% recycled nylon shell, wind-resistant','Snap-button front closure','Embroidered Velour logo tab at chest','Two side snap pockets, one chest zip pocket','Satin lining for easy on-and-off','Elasticated cuffs and hem','Regular fit, slightly boxy','Spot clean or dry clean only','Model wears size M, 6\'1"','Made in Vietnam'] },
      { id:5, name:'Wide Leg Jeans', cat:'bottoms', price:95, badge:'', img:'https://images.unsplash.com/photo-1542272604-787c3835535d?w=800&q=80',
        desc:'High-rise, wide-leg, and completely effortless. Made from premium Japanese selvedge denim with a slight stretch for all-day comfort. The relaxed cut through the hip and thigh tapers gently to a wide, floor-grazing leg. Five-pocket construction with antique brass hardware and a concealed button fly. The silhouette of the season.',
        details:['98% Japanese selvedge denim, 2% elastane','11oz mid-weight denim','High-rise waistband, concealed button fly','Five-pocket construction','Antique brass rivets and hardware','Wide leg, floor-grazing hem','Machine wash cold inside-out, hang dry','Model wears size 28, 5\'9"','Made in Japan'] },
      { id:6, name:'Ribbed Long Sleeve', cat:'tops', price:55, badge:'', img:'https://images.unsplash.com/photo-1571945153237-4929e783af4a?w=800&q=80',
        desc:'A minimalist essential for every wardrobe. This fine-ribbed long sleeve is body-skimming without being restrictive. Made from a smooth cotton-modal blend that\'s impossibly soft against the skin. The slim silhouette works on its own in warmer months and layers seamlessly under a coach jacket or puffer vest when it cools down.',
        details:['55% Organic cotton, 45% modal','Fine-rib knit texture','Slim, body-skimming fit','Crew neckline, clean hem','Naturally breathable and moisture-wicking','Soft drape, holds shape wash after wash','Machine wash cold, lay flat to dry','Unisex — model wears size S, 5\'10"','Made in Italy'] },
      { id:7, name:'Puffer Vest', cat:'outerwear', price:110, badge:'Bestseller', img:'https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=800&q=80',
        desc:'Warmth without the bulk. Our sleeveless puffer vest is filled with 100% recycled synthetic down and finished in a matte nylon shell that resists water and wind. Wear it over a hoodie for weekend warmth, or over a tailored shirt for a smart-casual edge. It packs down small enough to fit in your bag — always ready when you need it.',
        details:['Matte recycled nylon shell','100% recycled synthetic down fill (600-fill power)','Water-resistant DWR finish','Two-way front zip closure','Two inner zip pockets, one chest zip pocket','Packable — includes carry pouch','Relaxed fit, sits at hip','Machine wash cold, tumble dry low with tennis balls','Model wears size M, 6\'0"','Made in Vietnam'] },
      { id:8, name:'Utility Shorts', cat:'bottoms', price:60, badge:'', img:'https://images.unsplash.com/photo-1562157873-818bc0726f68?w=800&q=80',
        desc:'Relaxed and ready for anything. Cut from a durable cotton-twill in a mid-thigh length with multiple cargo pockets and an adjustable drawstring waistband. The vintage enzyme wash gives them a broken-in feel from the moment you put them on. Whether you\'re in the city or at the coast, these shorts will carry you through every occasion this summer.',
        details:['100% cotton twill, 240gsm','Enzyme-washed for vintage texture','Adjustable drawstring waistband','Two side pockets, two cargo pockets, one back pocket','Mid-thigh length — approx 9" inseam','Reinforced pocket stitching','Machine wash cold, tumble dry low','Model wears size M, 6\'0"','Made in Turkey'] },
    ];

    const sizes = ['XS','S','M','L','XL','XXL'];
    let selectedSize = null;
    let cart = JSON.parse(sessionStorage.getItem('velour_cart') || '[]');

    // ── Get product from URL ──
    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get('id'));
    const product = products.find(p => p.id === productId);

    function renderPage() {
      const page = document.getElementById('pageContent');

      if (!product) {
        page.innerHTML = `
          <div class="not-found">
            <h1>Product Not Found</h1>
            <p>This item doesn't exist or may have been removed.</p>
            <a href="index.html" class="add-btn" style="display:inline-block;width:auto;padding:14px 40px;text-decoration:none;">Back to Shop</a>
          </div>`;
        return;
      }

      // Related: same category, exclude current
      const related = products.filter(p => p.cat === product.cat && p.id !== product.id).slice(0, 4);
      // If fewer than 4, fill with other products
      if (related.length < 4) {
        const others = products.filter(p => p.id !== product.id && !related.includes(p));
        related.push(...others.slice(0, 4 - related.length));
      }

      document.title = `Velour — ${product.name}`;

      page.innerHTML = `
        <div class="breadcrumb">
          <a href="index.html">Shop</a>
          <span>/</span>
          <a href="index.html#shop">${product.cat.charAt(0).toUpperCase() + product.cat.slice(1)}</a>
          <span>/</span>
          ${product.name}
        </div>

        <div class="product-page">
          <!-- IMAGE -->
          <div class="product-image-wrap">
            <div class="main-image">
              <img src="${product.img}" alt="${product.name}"/>
            </div>
            ${product.badge ? `<span class="product-badge-lg">${product.badge}</span>` : ''}
          </div>

          <!-- INFO -->
          <div class="product-info">
            <p class="product-cat-label">${product.cat}</p>
            <h1 class="product-title">${product.name}</h1>
            <p class="product-price-lg">£${product.price}</p>

            <hr class="divider"/>

            <p class="product-desc">${product.desc}</p>

            <hr class="divider"/>

            <p class="size-label">Select Size</p>
            <div class="size-options" id="sizeOptions">
              ${sizes.map(s => `<button class="size-btn" onclick="selectSize('${s}', this)">${s}</button>`).join('')}
            </div>

            <button class="add-btn" onclick="handleAddToBag()">Add to Bag</button>
            <button class="wishlist-btn">♡ &nbsp; Save to Wishlist</button>

            <hr class="divider"/>

            <p class="details-title">Product Details</p>
            <ul class="details-list">
              ${product.details.map(d => `<li>${d}</li>`).join('')}
            </ul>

            <hr class="divider"/>

            <div class="accordion-block">
              <button class="accordion-btn" onclick="toggleAccordion(this)">
                <span>Shipping &amp; Delivery</span> <span class="acc-icon">+</span>
              </button>
              <div class="accordion-body">
                <p>Standard delivery: 3–5 working days — <strong>Free over £80</strong>, £3.99 under</p>
                <p>Express delivery: 1–2 working days — £6.99</p>
                <p>Next day delivery: Order before 2pm — £9.99</p>
                <p style="margin-top:10px;color:var(--muted)">Orders placed Monday–Friday are dispatched same day. Weekend orders are dispatched the following Monday.</p>
              </div>
            </div>
            <div class="accordion-block">
              <button class="accordion-btn" onclick="toggleAccordion(this)">
                <span>Returns &amp; Exchanges</span> <span class="acc-icon">+</span>
              </button>
              <div class="accordion-body">
                <p>We offer free returns within <strong>30 days</strong> of delivery for unworn, unwashed items with all tags attached.</p>
                <p style="margin-top:8px">Exchanges can be requested for a different size. Simply note your preferred size when submitting your return.</p>
                <p style="margin-top:8px;color:var(--muted)">Items marked as Final Sale are not eligible for return or exchange.</p>
              </div>
            </div>
            <div class="accordion-block">
              <button class="accordion-btn" onclick="toggleAccordion(this)">
                <span>Sustainability</span> <span class="acc-icon">+</span>
              </button>
              <div class="accordion-body">
                <p>Every Velour piece is made from sustainably sourced fabrics in certified ethical factories. We use organic and recycled materials wherever possible, and our packaging is 100% compostable.</p>
                <p style="margin-top:8px;color:var(--muted)">We offset all carbon emissions from shipping through verified reforestation projects.</p>
              </div>
            </div>

            <div class="trust-row">
              <div class="trust-item"><span class="trust-icon">🚚</span> Free shipping over £80</div>
              <div class="trust-item"><span class="trust-icon">↩</span> 30-day returns</div>
              <div class="trust-item"><span class="trust-icon">🌿</span> Sustainably made</div>
            </div>
          </div>
        </div>

        <!-- RELATED -->
        ${related.length > 0 ? `
        <div class="related-section">
          <div class="related-header">
            <p class="related-tag">You May Also Like</p>
            <h2 class="related-title">More From Velour</h2>
          </div>
          <div class="related-grid">
            ${related.map(r => `
              <div class="rel-card" onclick="window.location.href='product.html?id=${r.id}'">
                <div class="rel-img">
                  <img src="${r.img}" alt="${r.name}" loading="lazy"/>
                  <div class="rel-overlay">
                    <button class="rel-overlay-btn" onclick="event.stopPropagation(); addToCart(${r.id})">Add to Bag</button>
                  </div>
                </div>
                <div class="rel-name">${r.name}</div>
                <div class="rel-price">£${r.price}</div>
              </div>
            `).join('')}
          </div>
        </div>` : ''}
      `;

      updateCartDisplay();
    }

    function selectSize(size, btn) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function handleAddToBag() {
      if (!selectedSize) {
        showToast('Please select a size');
        document.getElementById('sizeOptions').style.outline = '1px solid rgba(232,213,176,0.6)';
        setTimeout(() => document.getElementById('sizeOptions').style.outline = '', 1500);
        return;
      }
      addToCart(product.id);
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty++; }
      else { cart.push({ ...p, qty: 1 }); }
      sessionStorage.setItem('velour_cart', JSON.stringify(cart));
      updateCartDisplay();
      showToast(`${p.name} added to bag`);
      openCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      sessionStorage.setItem('velour_cart', JSON.stringify(cart));
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = `£${total}`;

      const itemsEl = document.getElementById('cartItems');
      const footerEl = document.getElementById('cartFooter');

      if (cart.length === 0) {
        itemsEl.innerHTML = '<div class="cart-empty">Your bag is empty.<br/>Add something you love.</div>';
        footerEl.style.display = 'none';
      } else {
        itemsEl.innerHTML = cart.map(item => `
          <div class="cart-item">
            <img class="cart-item-img" src="${item.img}" alt="${item.name}"/>
            <div>
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-size">Qty: ${item.qty}</div>
              <div class="cart-item-price">£${item.price * item.qty}</div>
              <button class="cart-item-remove" onclick="removeFromCart(${item.id})">Remove</button>
            </div>
          </div>
        `).join('');
        footerEl.style.display = 'block';
      }
    }

    function openCart() {
      document.getElementById('cartDrawer').classList.add('open');
      document.getElementById('cartOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeCart() {
      document.getElementById('cartDrawer').classList.remove('open');
      document.getElementById('cartOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function goToCheckout() {
      if (cart.length === 0) return;
      sessionStorage.setItem('velour_cart', JSON.stringify(cart));
      window.location.href = 'checkout.html';
    }

    function toggleAccordion(btn) {
      const body = btn.nextElementSibling;
      const isOpen = body.classList.contains('open');
      // Close all
      document.querySelectorAll('.accordion-body').forEach(b => b.classList.remove('open'));
      document.querySelectorAll('.accordion-btn').forEach(b => b.classList.remove('open'));
      // Open clicked if it was closed
      if (!isOpen) {
        body.classList.add('open');
        btn.classList.add('open');
      }
    }

    // ── Init ──
    renderPage();
  </script>

</body>
</html>
