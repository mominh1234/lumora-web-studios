<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaTech – Order Confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --card: #111111;
      --card2: #161616;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,0.12);
      --accent-glow: rgba(0,212,255,0.3);
      --green: #00ff88;
      --green-dim: rgba(0,255,136,0.1);
      --white: #ffffff;
      --grey: #888888;
      --grey2: #555555;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --font-head: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; top: -10%; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 900px;
      background: radial-gradient(circle, rgba(0,255,136,0.04) 0%, rgba(0,212,255,0.04) 40%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 70px;
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-head);
      font-size: 1.4rem; font-weight: 700;
      color: var(--white); text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }

    /* ── PROGRESS ── */
    .progress-bar {
      position: fixed; top: 70px; left: 0; right: 0; z-index: 99;
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }
    .progress-inner {
      max-width: 900px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .step {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-head);
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.5px; color: var(--grey2);
    }
    .step.done { color: var(--accent); }
    .step.confirmed { color: var(--green); }
    .step-num {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
      border: 1.5px solid var(--grey2); background: transparent;
    }
    .step.done .step-num { background: var(--accent); border-color: var(--accent); color: #000; }
    .step.confirmed .step-num { background: var(--green); border-color: var(--green); color: #000; box-shadow: 0 0 14px rgba(0,255,136,0.4); }
    .step-line { width: 64px; height: 1px; background: var(--border2); margin: 0 4px; }
    .step-line.done { background: var(--accent); opacity: 0.5; }
    .step-line.confirmed { background: var(--green); opacity: 0.5; }

    /* ── PAGE ── */
    main {
      max-width: 820px; margin: 0 auto;
      padding: 160px 24px 80px;
      position: relative; z-index: 1;
    }

    /* ── SUCCESS HERO ── */
    .success-hero {
      text-align: center;
      margin-bottom: 48px;
    }
    .success-circle {
      width: 96px; height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--green-dim);
      border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(0,255,136,0.25);
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .success-circle svg {
      width: 44px; height: 44px;
      stroke: var(--green); stroke-width: 3;
      fill: none;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawCheck 0.5s 0.4s ease forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }
    .success-hero h1 {
      font-family: var(--font-head);
      font-size: 2rem; font-weight: 700;
      margin-bottom: 10px;
    }
    .success-hero p { color: var(--grey); font-size: 0.95rem; }

    /* ── ORDER REF BOX ── */
    .ref-box {
      display: flex; align-items: center; justify-content: center;
      gap: 14px;
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 16px 24px;
      margin: 0 auto 40px;
      max-width: 380px;
    }
    .ref-label { font-size: 0.78rem; color: var(--grey); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
    .ref-value {
      font-family: var(--font-head);
      font-size: 1.15rem; font-weight: 700;
      color: var(--accent); letter-spacing: 1px;
    }
    .btn-copy {
      background: transparent; border: 1px solid var(--border2);
      border-radius: 8px; padding: 6px 12px;
      font-size: 0.75rem; color: var(--grey);
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
      font-family: var(--font-body);
    }
    .btn-copy:hover { color: var(--accent); border-color: var(--accent); }

    /* ── DETAILS GRID ── */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 600px) { .details-grid { grid-template-columns: 1fr; } }
    .detail-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
    }
    .detail-card-label {
      font-size: 0.72rem; font-weight: 600; color: var(--grey);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .detail-card-val {
      font-size: 0.88rem; line-height: 1.7; color: var(--white);
    }
    .detail-card-val strong {
      font-family: var(--font-head); font-weight: 600;
    }

    /* ── ORDER ITEMS ── */
    .section-heading {
      font-family: var(--font-head);
      font-size: 1.1rem; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-heading::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .order-items-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    .order-item {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
    }
    .order-item:last-of-type { border-bottom: none; }
    .order-item-icon {
      width: 48px; height: 48px;
      background: var(--card2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .order-item-info { flex: 1; }
    .order-item-name {
      font-family: var(--font-head);
      font-size: 0.9rem; font-weight: 600;
    }
    .order-item-qty { font-size: 0.78rem; color: var(--grey); }
    .order-item-price {
      font-family: var(--font-head);
      font-size: 1rem; font-weight: 700;
      color: var(--accent);
    }
    .order-totals { padding: 16px 22px; background: var(--card2); }
    .totals-row {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; color: var(--grey);
      margin-bottom: 6px;
    }
    .totals-row span:last-child { color: var(--white); }
    .totals-row.discount span:last-child { color: #ff8c42; }
    .totals-row.total {
      border-top: 1px solid var(--border2);
      padding-top: 12px; margin-top: 6px;
    }
    .totals-row.total span {
      font-family: var(--font-head);
      font-size: 1.05rem; font-weight: 700;
      color: var(--white);
    }
    .totals-row.total span:last-child { color: var(--accent); font-size: 1.2rem; }

    /* ── TIMELINE ── */
    .timeline-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      margin-bottom: 40px;
    }
    .timeline-progress {
      height: 4px; background: var(--border2);
      border-radius: 4px; margin-bottom: 28px;
      overflow: hidden;
    }
    .timeline-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--green), var(--accent));
      border-radius: 4px;
      transition: width 1.2s ease;
    }
    .timeline-steps {
      display: flex; justify-content: space-between;
      gap: 4px;
    }
    .timeline-step { flex: 1; text-align: center; }
    .timeline-dot {
      width: 32px; height: 32px; border-radius: 50%;
      margin: 0 auto 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      border: 1.5px solid var(--border2);
      background: var(--card2);
      transition: all 0.4s;
    }
    .timeline-step.active .timeline-dot {
      background: var(--green-dim); border-color: var(--green);
      box-shadow: 0 0 12px rgba(0,255,136,0.3);
    }
    .timeline-step-label {
      font-size: 0.72rem; color: var(--grey);
      font-family: var(--font-head); font-weight: 600;
      line-height: 1.3;
    }
    .timeline-step.active .timeline-step-label { color: var(--green); }

    /* ── CTAs ── */
    .cta-row {
      display: flex; gap: 14px; justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--accent); color: #000;
      border: none; border-radius: 12px;
      padding: 14px 32px;
      font-family: var(--font-head);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary {
      background: transparent; color: var(--white);
      border: 1.5px solid var(--border2);
      border-radius: 12px; padding: 14px 32px;
      font-family: var(--font-head);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      main { padding: 160px 16px 60px; }
      .success-hero h1 { font-size: 1.5rem; }
      .cta-row { flex-direction: column; }
      .btn-primary, .btn-secondary { text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Nova<span>Tech</span></a>
  </nav>

  <div class="progress-bar">
    <div class="progress-inner">
      <div class="step done">
        <div class="step-num">✓</div>
        <span>Delivery</span>
      </div>
      <div class="step-line done"></div>
      <div class="step done">
        <div class="step-num">✓</div>
        <span>Payment</span>
      </div>
      <div class="step-line confirmed"></div>
      <div class="step confirmed">
        <div class="step-num">✓</div>
        <span>Confirmed</span>
      </div>
    </div>
  </div>

  <main>
    <!-- Success Hero -->
    <div class="success-hero">
      <div class="success-circle">
        <svg viewBox="0 0 48 48">
          <polyline points="10,24 20,34 38,16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Order Confirmed!</h1>
      <p>Thanks for your order. A confirmation email has been sent to <strong id="heroEmail">you</strong>.</p>
    </div>

    <!-- Order Ref -->
    <div class="ref-box">
      <div>
        <div class="ref-label">Order Reference</div>
        <div class="ref-value" id="orderRef">NVT-——</div>
      </div>
      <button class="btn-copy" onclick="copyRef()">Copy</button>
    </div>

    <!-- Details Grid -->
    <div class="details-grid" id="detailsGrid"></div>

    <!-- Order Items -->
    <div class="section-heading">Items Ordered</div>
    <div class="order-items-card">
      <div id="orderItemsList"></div>
      <div class="order-totals" id="orderTotals"></div>
    </div>

    <!-- Delivery Timeline -->
    <div class="section-heading">Delivery Status</div>
    <div class="timeline-card">
      <div class="timeline-progress">
        <div class="timeline-fill" id="timelineFill"></div>
      </div>
      <div class="timeline-steps" id="timelineSteps"></div>
    </div>

    <!-- CTAs -->
    <div class="cta-row">
      <a href="hardware.html" class="btn-primary">Continue Shopping</a>
      <a href="index.html" class="btn-secondary">Back to Home</a>
    </div>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem('novatech_cart') || '[]');
    const shipping = JSON.parse(localStorage.getItem('novatech_shipping') || 'null');
    const orderRef = localStorage.getItem('novatech_orderRef') || 'NVT-??????';
    const orderMethod = localStorage.getItem('novatech_orderMethod') || 'Card';

    if (!cart.length || !shipping) { window.location.href = 'index.html'; }

    function addBusinessDays(date, days) {
      let d = new Date(date);
      let added = 0;
      while (added < days) {
        d.setDate(d.getDate() + 1);
        const dow = d.getDay();
        if (dow !== 0 && dow !== 6) added++;
      }
      return d;
    }

    function formatDate(d) {
      return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    // ── Order Ref ──
    document.getElementById('orderRef').textContent = orderRef;
    document.getElementById('heroEmail').textContent = shipping.email;

    function copyRef() {
      navigator.clipboard.writeText(orderRef).catch(() => {});
      const btn = document.querySelector('.btn-copy');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    }

    // ── Details Grid ──
    const delivLabels = { standard: 'Standard (3–5 days)', express: 'Express (1–2 days)', nextday: 'Next Day' };
    const countryNames = { GB:'United Kingdom', IE:'Ireland', US:'United States', CA:'Canada', AU:'Australia', DE:'Germany', FR:'France', NL:'Netherlands' };
    const delivDays = { standard: 5, express: 2, nextday: 1 };
    const arrivalDate = formatDate(addBusinessDays(new Date(), delivDays[shipping.delivery] || 5));

    document.getElementById('detailsGrid').innerHTML = `
      <div class="detail-card">
        <div class="detail-card-label">📦 Shipping Address</div>
        <div class="detail-card-val">
          <strong>${shipping.firstName} ${shipping.lastName}</strong><br>
          ${shipping.address1}${shipping.address2 ? '<br>' + shipping.address2 : ''}<br>
          ${shipping.city}, ${shipping.postcode}<br>
          ${countryNames[shipping.country] || shipping.country}
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-card-label">🚚 Delivery Method</div>
        <div class="detail-card-val">
          <strong>${delivLabels[shipping.delivery] || shipping.delivery}</strong><br>
          Estimated arrival:<br>
          <strong>${arrivalDate}</strong>
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-card-label">💳 Payment</div>
        <div class="detail-card-val">
          <strong>${orderMethod}</strong><br>
          Amount charged:<br>
          <strong>£${shipping.total.toLocaleString('en-GB', {minimumFractionDigits:2})}</strong>
        </div>
      </div>
      <div class="detail-card">
        <div class="detail-card-label">📧 Contact</div>
        <div class="detail-card-val">
          ${shipping.email}<br>
          ${shipping.phone}
        </div>
      </div>
    `;

    // ── Items ──
    document.getElementById('orderItemsList').innerHTML = cart.map(i => `
      <div class="order-item">
        <div class="order-item-icon">${i.icon}</div>
        <div class="order-item-info">
          <div class="order-item-name">${i.name}</div>
          <div class="order-item-qty">Qty: ${i.qty}</div>
        </div>
        <div class="order-item-price">£${(i.price * i.qty).toLocaleString('en-GB', {minimumFractionDigits:2})}</div>
      </div>
    `).join('');

    const delivLine = shipping.deliveryCost === 0
      ? `<div class="totals-row"><span>Delivery</span><span style="color:#00ff88;">FREE</span></div>`
      : `<div class="totals-row"><span>Delivery</span><span>£${shipping.deliveryCost.toFixed(2)}</span></div>`;

    const discountLine = shipping.discount > 0
      ? `<div class="totals-row discount"><span>Discount</span><span>-£${shipping.discount.toLocaleString('en-GB', {minimumFractionDigits:2})}</span></div>`
      : '';

    document.getElementById('orderTotals').innerHTML = `
      <div class="totals-row"><span>Subtotal</span><span>£${shipping.subtotal.toLocaleString('en-GB', {minimumFractionDigits:2})}</span></div>
      ${delivLine}
      ${discountLine}
      <div class="totals-row total"><span>Total</span><span>£${shipping.total.toLocaleString('en-GB', {minimumFractionDigits:2})}</span></div>
    `;

    // ── Timeline ──
    const timelineData = [
      { label: 'Order\nPlaced', icon: '✓', active: true },
      { label: 'Processing', icon: '⚙️', active: true },
      { label: 'Dispatched', icon: '📦', active: false },
      { label: 'In Transit', icon: '🚚', active: false },
      { label: 'Delivered', icon: '🏠', active: false },
    ];

    document.getElementById('timelineSteps').innerHTML = timelineData.map(s => `
      <div class="timeline-step ${s.active ? 'active' : ''}">
        <div class="timeline-dot">${s.icon}</div>
        <div class="timeline-step-label">${s.label.replace('\n', '<br>')}</div>
      </div>
    `).join('');

    setTimeout(() => {
      document.getElementById('timelineFill').style.width = '30%';
    }, 300);

    // ── Clear cart ──
    localStorage.removeItem('novatech_cart');
    localStorage.removeItem('novatech_shipping');
    localStorage.removeItem('novatech_orderRef');
    localStorage.removeItem('novatech_orderMethod');
  </script>
</body>
</html>
