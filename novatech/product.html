<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaTech – Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --card: #111111;
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.15);
      --accent-glow: rgba(0, 212, 255, 0.35);
      --white: #ffffff;
      --grey: #888888;
      --border: rgba(255,255,255,0.07);
      --font-head: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 900px;
      background: radial-gradient(circle, rgba(0,212,255,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 70px;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-head);
      font-size: 1.5rem; font-weight: 700;
      color: var(--white); text-decoration: none; letter-spacing: -0.5px;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a {
      font-size: 0.9rem; font-weight: 500;
      color: var(--grey); text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-cart-btn {
      position: relative; background: none; border: none;
      cursor: pointer; color: var(--grey); font-size: 1.2rem;
      padding: 6px; transition: color 0.2s;
    }
    .nav-cart-btn:hover { color: var(--white); }
    .cart-count {
      position: absolute; top: 0; right: 0;
      background: var(--accent); color: #000;
      font-size: 0.6rem; font-weight: 700;
      width: 16px; height: 16px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
    }
    .btn-nav-cta {
      background: var(--accent); color: #000;
      font-family: var(--font-body); font-size: 0.85rem; font-weight: 600;
      padding: 10px 22px; border-radius: 8px;
      text-decoration: none; border: none; cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-nav-cta:hover { opacity: 0.85; transform: translateY(-1px); }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none; padding: 4px;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--white); border-radius: 2px; transition: all 0.3s;
    }
    .mobile-menu {
      display: none; position: fixed;
      top: 70px; left: 0; right: 0;
      background: rgba(8,8,8,0.97);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 24px 48px; z-index: 999;
      flex-direction: column; gap: 20px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-size: 1rem; font-weight: 500; color: var(--grey);
      text-decoration: none; transition: color 0.2s;
    }
    .mobile-menu a:hover { color: var(--white); }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      position: relative; z-index: 1;
      padding: 100px 48px 0;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.8rem; color: var(--grey);
    }
    .breadcrumb a { color: var(--grey); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb span { color: rgba(255,255,255,0.2); }

    /* ── PRODUCT LAYOUT ── */
    .product-page {
      position: relative; z-index: 1;
      padding: 40px 48px 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 72px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* ── IMAGE PANEL ── */
    .product-image-wrap {
      position: sticky; top: 90px;
      align-self: start;
    }
    .main-image {
      width: 100%; aspect-ratio: 4/3;
      overflow: hidden;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      position: relative;
    }
    .main-image img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .main-image:hover img { transform: scale(1.04); }
    .main-image::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,212,255,0.04) 0%, transparent 70%);
      pointer-events: none;
    }
    .badge-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 6px 14px; border-radius: 100px;
    }
    .badge-new { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,212,255,0.25); }
    .badge-stock { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.2); }
    .badge-warranty { background: rgba(255,255,255,0.05); color: var(--grey); border: 1px solid var(--border); }

    /* ── INFO PANEL ── */
    .product-info { padding-top: 4px; }
    .product-cat-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
    }
    .product-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700; letter-spacing: -1px; line-height: 1.05;
      margin-bottom: 16px;
    }
    .product-price-lg {
      font-family: var(--font-head);
      font-size: 2rem; font-weight: 700;
      color: var(--accent); margin-bottom: 28px;
      letter-spacing: -0.5px;
    }
    .price-note {
      font-size: 0.78rem; color: var(--grey); font-weight: 400;
      margin-left: 6px; letter-spacing: 0;
    }

    .divider {
      border: none; border-top: 1px solid var(--border); margin: 24px 0;
    }

    .product-desc {
      font-size: 0.95rem; font-weight: 300;
      color: rgba(255,255,255,0.65); line-height: 1.85;
      margin-bottom: 28px;
    }

    /* ── SPEC GRID ── */
    .spec-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 32px;
    }
    .spec-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color 0.2s;
    }
    .spec-item:hover { border-color: rgba(0,212,255,0.2); }
    .spec-label {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--grey); margin-bottom: 4px;
    }
    .spec-value {
      font-family: var(--font-head);
      font-size: 0.9rem; font-weight: 600; color: var(--white);
    }

    /* ── ADD TO BASKET ── */
    .add-btn {
      display: block; width: 100%; padding: 18px;
      background: var(--accent); color: #000;
      border: none; cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.95rem; font-weight: 700;
      border-radius: 12px;
      transition: all 0.25s;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }
    .add-btn:hover {
      background: #fff;
      box-shadow: 0 12px 40px rgba(0,212,255,0.3);
      transform: translateY(-1px);
    }
    .add-btn.added { background: #00ff88; }

    .wishlist-btn {
      display: block; width: 100%; padding: 16px;
      background: transparent; color: var(--white);
      border: 1px solid var(--border); cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.88rem; font-weight: 500;
      border-radius: 12px;
      transition: border-color 0.2s, color 0.2s;
    }
    .wishlist-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── ACCORDION ── */
    .accordion-block {
      border-top: 1px solid var(--border);
    }
    .accordion-block:last-of-type {
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .accordion-btn {
      width: 100%; background: none; border: none;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0; cursor: pointer;
      font-family: var(--font-head);
      font-size: 0.9rem; font-weight: 600;
      color: var(--white); transition: color 0.2s;
    }
    .accordion-btn:hover { color: var(--accent); }
    .acc-icon { font-size: 1.1rem; transition: transform 0.25s; color: var(--accent); }
    .accordion-btn.open .acc-icon { transform: rotate(45deg); }
    .accordion-body {
      display: none; padding: 0 0 20px;
      font-size: 0.85rem; font-weight: 300;
      color: rgba(255,255,255,0.6); line-height: 1.8;
    }
    .accordion-body.open { display: block; }
    .accordion-body p + p { margin-top: 8px; }

    /* ── TRUST STRIP ── */
    .trust-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-top: 28px;
    }
    .trust-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 14px;
      text-align: center; transition: border-color 0.2s;
    }
    .trust-item:hover { border-color: rgba(0,212,255,0.2); }
    .trust-icon { font-size: 1.4rem; display: block; margin-bottom: 6px; }
    .trust-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px;
      color: var(--grey); display: block;
    }

    /* ── RELATED ── */
    .related-section {
      position: relative; z-index: 1;
      padding: 0 48px 100px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .related-header {
      border-top: 1px solid var(--border);
      padding-top: 64px; margin-bottom: 36px;
    }
    .related-tag {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
      display: block;
    }
    .related-title {
      font-family: var(--font-head);
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700; letter-spacing: -0.5px;
    }
    .related-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
    }
    .rel-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .rel-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(0,212,255,0.1);
      border-color: rgba(0,212,255,0.25);
    }
    .rel-img { height: 160px; overflow: hidden; background: #0a0a0a; position: relative; }
    .rel-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .rel-card:hover .rel-img img { transform: scale(1.06); }
    .rel-img::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 50px; background: linear-gradient(to top, var(--card), transparent); z-index: 1;
    }
    .rel-info { padding: 16px; }
    .rel-name { font-family: var(--font-head); font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .rel-spec { font-size: 0.72rem; color: var(--grey); margin-bottom: 12px; line-height: 1.5; }
    .rel-bottom { display: flex; align-items: center; justify-content: space-between; }
    .rel-price { font-family: var(--font-head); font-size: 1rem; font-weight: 700; color: var(--accent); }
    .rel-btn {
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid rgba(0,212,255,0.2);
      font-family: var(--font-body); font-size: 0.72rem; font-weight: 600;
      padding: 6px 14px; border-radius: 7px; cursor: pointer;
      transition: all 0.2s;
    }
    .rel-btn:hover { background: var(--accent); color: #000; }

    /* ── CART SIDEBAR ── */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1100; display: none; backdrop-filter: blur(4px);
    }
    .cart-overlay.open { display: block; }
    .cart-sidebar {
      position: fixed; top: 0; right: -420px;
      width: 420px; max-width: 100vw; height: 100%;
      background: #0e0e0e; border-left: 1px solid var(--border);
      z-index: 1200; display: flex; flex-direction: column;
      transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .cart-sidebar.open { right: 0; }
    .cart-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px; border-bottom: 1px solid var(--border);
    }
    .cart-header h3 { font-family: var(--font-head); font-size: 1.1rem; font-weight: 600; }
    .cart-close-btn {
      background: none; border: none; color: var(--grey);
      font-size: 1.4rem; cursor: pointer; line-height: 1; transition: color 0.2s;
    }
    .cart-close-btn:hover { color: var(--white); }
    .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
    .cart-empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 200px; color: var(--grey);
      font-size: 0.9rem; gap: 12px;
    }
    .cart-empty span { font-size: 3rem; }
    .cart-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .cart-item-icon {
      width: 52px; height: 52px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; background: #1a1a1a; flex-shrink: 0;
    }
    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-family: var(--font-head); font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
    .cart-item-info p { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
    .cart-item-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      background: #1a1a1a; border: 1px solid var(--border); color: var(--white);
      width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
      font-size: 1rem; line-height: 1; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: var(--accent); color: #000; }
    .qty-num { font-size: 0.9rem; font-weight: 600; min-width: 20px; text-align: center; }
    .remove-btn {
      background: none; border: none; color: #444;
      cursor: pointer; font-size: 1rem; transition: color 0.2s; padding: 2px;
    }
    .remove-btn:hover { color: #ff4444; }
    .cart-footer { padding: 20px 24px; border-top: 1px solid var(--border); }
    .cart-subtotal {
      display: flex; justify-content: space-between;
      margin-bottom: 6px; font-size: 0.85rem; color: var(--grey);
    }
    .cart-total-row {
      display: flex; justify-content: space-between;
      font-family: var(--font-head); font-size: 1.1rem; font-weight: 700;
      margin-bottom: 20px;
    }
    .cart-total-row span:last-child { color: var(--accent); }
    .btn-checkout {
      width: 100%; background: var(--accent); color: #000;
      border: none; font-family: var(--font-body);
      font-size: 0.95rem; font-weight: 700; padding: 16px;
      border-radius: 10px; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-checkout:hover { opacity: 0.85; }

    /* ── NOT FOUND ── */
    .not-found {
      position: relative; z-index: 1;
      padding: 200px 48px 100px; text-align: center;
    }
    .not-found h1 {
      font-family: var(--font-head); font-size: 2.5rem;
      font-weight: 700; margin-bottom: 16px;
    }
    .not-found p { color: var(--grey); margin-bottom: 32px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .product-page { grid-template-columns: 1fr; gap: 48px; padding: 32px 32px 80px; }
      .product-image-wrap { position: static; }
      .related-grid { grid-template-columns: repeat(2, 1fr); }
      .related-section { padding: 0 32px 80px; }
      .breadcrumb { padding: 100px 32px 0; }
    }
    @media (max-width: 768px) {
      nav { padding: 0 24px; }
      .nav-links { display: none; }
      .btn-nav-cta { display: none; }
      .hamburger { display: flex; }
      .product-page { padding: 24px 20px 60px; }
      .breadcrumb { padding: 90px 20px 0; }
      .related-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .related-section { padding: 0 20px 60px; }
      .cart-sidebar { width: 100vw; right: -100vw; }
      .trust-row { grid-template-columns: 1fr 1fr 1fr; }
      .spec-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .related-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

              <div class="rel-card" onclick="window.location.href='product.html?id=${r.id}'">
                <div class="rel-img">
                  <img src="${r.img}" alt="${r.name}" loading="lazy"/>
                </div>
                <div class="rel-info">
                  <div class="rel-name">${r.name}</div>
                  <div class="rel-spec">${Object.values(r.specs).slice(0,2).join(' · ')}</div>
                  <div class="rel-bottom">
                    <span class="rel-price">£${r.price.toLocaleString('en-GB')}</span>
                    <button class="rel-btn" onclick="event.stopPropagation(); addRelToCart('${r.id}')">Add to Basket</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>` : ''}
      `;

      updateCartDisplay();
    }

    function addToCart() {
      const id = product.id;
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty++; }
      else { cart.push({ id, name: product.name, price: product.price, icon: product.icon, qty: 1 }); }
      saveCart();
      updateCartDisplay();
      const btn = document.getElementById('addBtn');
      btn.textContent = 'Added ✓';
      btn.classList.add('added');
      setTimeout(() => { btn.textContent = 'Add to Basket'; btn.classList.remove('added'); }, 1800);
      openCart();
    }

    function addRelToCart(id) {
      const p = products[id];
      if (!p) return;
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty++; }
      else { cart.push({ id, name: p.name, price: p.price, icon: p.icon, qty: 1 }); }
      saveCart();
      updateCartDisplay();
      openCart();
    }

    function saveCart() { localStorage.setItem('novatech_cart', JSON.stringify(cart)); }

    function updateCartDisplay() {
      const total = cart.reduce((s, i) => s + i.qty, 0);
      const countEl = document.getElementById('cartCount');
      countEl.textContent = total;
      countEl.style.display = total > 0 ? 'flex' : 'none';

      const itemsEl = document.getElementById('cartItems');
      const emptyEl = document.getElementById('cartEmpty');
      const subtotalEl = document.getElementById('cartSubtotal');
      const totalEl = document.getElementById('cartTotal');

      if (cart.length === 0) {
        emptyEl.style.display = 'flex';
        subtotalEl.textContent = '£0.00';
        totalEl.textContent = '£0.00';
        Array.from(itemsEl.children).forEach(c => { if (c !== emptyEl) c.remove(); });
        return;
      }
      emptyEl.style.display = 'none';
      Array.from(itemsEl.children).forEach(c => { if (c !== emptyEl) c.remove(); });

      let grandTotal = 0;
      cart.forEach(item => {
        grandTotal += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="cart-item-icon">${item.icon}</div>
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <p>£${(item.price * item.qty).toLocaleString('en-GB', {minimumFractionDigits:2})}</p>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn" data-id="${item.id}" data-action="dec">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-action="inc">+</button>
            <button class="remove-btn" data-id="${item.id}" title="Remove">✕</button>
          </div>
        `;
        itemsEl.appendChild(div);
      });

      subtotalEl.textContent = `£${grandTotal.toLocaleString('en-GB', {minimumFractionDigits:2})}`;
      totalEl.textContent = `£${grandTotal.toLocaleString('en-GB', {minimumFractionDigits:2})}`;

      itemsEl.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          const idx = cart.findIndex(i => i.id === id);
          if (idx === -1) return;
          if (action === 'inc') cart[idx].qty++;
          else { cart[idx].qty--; if (cart[idx].qty <= 0) cart.splice(idx, 1); }
          saveCart(); updateCartDisplay();
        });
      });
      itemsEl.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          cart = cart.filter(i => i.id !== btn.dataset.id);
          saveCart(); updateCartDisplay();
        });
      });
    }

    function openCart() {
      document.getElementById('cartSidebar').classList.add('open');
      document.getElementById('cartOverlay').classList.add('open');
    }
    function closeCart() {
      document.getElementById('cartSidebar').classList.remove('open');
      document.getElementById('cartOverlay').classList.remove('open');
    }

    function toggleAccordion(btn) {
      const body = btn.nextElementSibling;
      const isOpen = body.classList.contains('open');
      document.querySelectorAll('.accordion-body').forEach(b => b.classList.remove('open'));
      document.querySelectorAll('.accordion-btn').forEach(b => b.classList.remove('open'));
      if (!isOpen) { body.classList.add('open'); btn.classList.add('open'); }
    }

    // Hamburger
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburgerBtn.addEventListener('click', () => mobileMenu.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target))
        mobileMenu.classList.remove('open');
    });

    // Cart controls
    document.getElementById('cartToggleBtn').addEventListener('click', () => {
      document.getElementById('cartSidebar').classList.contains('open') ? closeCart() : openCart();
    });
    document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
    document.getElementById('cartOverlay').addEventListener('click', closeCart);

    document.querySelector('.btn-checkout').addEventListener('click', () => {
      if (cart.length === 0) return;
      window.location.href = 'checkout.html';
    });

    // Init
    renderPage();
  </script>

</body>
</html>
